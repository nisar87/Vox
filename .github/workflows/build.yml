name: Build, test and release

# Every push to main is tested on Linux and on a real Windows machine, built
# into an installer, and the installer itself is installed and self-tested.
# If vox/__init__.py names a version that has no release yet, one is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logic:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn websockets httpx psutil send2trash pytest
      - run: python -m pytest -v

  windows:
    name: Windows tests, installer and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests on Windows (skills, real programs, spoken commands)
        run: python -m pytest -v -rs

      - name: Build the program folder and the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./packaging/build.ps1
          Get-ChildItem dist | Format-Table Name, Length

      - name: Self-test the built program
        shell: pwsh
        run: |
          $p = Start-Process dist\Vox\Vox.exe -ArgumentList '-m', 'vox', '--self-test', "$PWD\selftest-build.json" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "self-test timed out" }
          Get-Content selftest-build.json
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install with the installer, start Vox, self-test the installed copy
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\VoxSetup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\install.log" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "installer timed out" }
          $exe = "$env:LOCALAPPDATA\Programs\Vox\Vox.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 60; Write-Error "Vox.exe was not installed" }

          # The installer starts Vox. Its window server must answer.
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 3
              if ($page.Content -match '<title>Vox</title>') { $ok = $true; break }
            } catch { Start-Sleep 2 }
          }
          if (-not $ok) {
            Get-Content "$env:APPDATA\Vox\vox.log" -ErrorAction SilentlyContinue
            Write-Error "The installed Vox did not start"
          }
          Write-Host "Installed Vox is running and serving its window."

          $p = Start-Process $exe -ArgumentList '-m', 'vox', '--self-test', "$PWD\selftest-installed.json" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "self-test timed out" }
          Get-Content selftest-installed.json
          taskkill /IM Vox.exe /F
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Scan with Microsoft Defender (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          # The hosted machine's Defender cannot reproduce the cloud-based checks a home PC runs,
          # so a clean result here is a good sign, not a guarantee.
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender is not available on this machine."; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          foreach ($target in "$PWD\dist\Vox", (Get-ChildItem dist\VoxSetup-*.exe).FullName) {
            & $mp -Scan -ScanType 3 -File $target -DisableRemediation
            Write-Host "Defender exit code for ${target}: $LASTEXITCODE (0 = clean, 2 = threat found)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VoxSetup
          path: |
            dist/VoxSetup-*.exe
            dist/VoxSetup-*.sha256
            selftest-*.json

      - name: Publish the release if this version is new
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python -c "import vox; print(vox.__version__)").Trim()
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$v is already released."; exit 0 }
          python packaging/release_notes.py $v | Out-File notes.md -Encoding utf8
          gh release create "v$v" "dist/VoxSetup-$v.exe" "dist/VoxSetup-$v.exe.sha256" `
            --target $env:GITHUB_SHA --title "Vox $v" --notes-file notes.md
